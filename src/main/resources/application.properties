# ==========================
# SERVER
# ==========================
server.port=${SERVER_PORT}

# ==========================
# DATABASE
# ==========================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}

jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}


# =========================================================
# PASSWORD RESET
# =========================================================

auth.password-reset.token-expiration=${AUTH_PASSWORD_RESET_TOKEN_EXPIRATION}

auth.password-reset.frontend-url=${AUTH_PASSWORD_RESET_FRONTEND_URL}

# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# FLYWAY
# ==========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/swagger-ui

springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.operationsSorter=method

springdoc.swagger-ui.tagsSorter=alpha

springdoc.default-produces-media-type=application/json

springdoc.default-consumes-media-type=application/json


# Redis Configuration
#spring.data.redis.host=${REDIS_HOST}
#spring.data.redis.port=${REDIS_PORT}
#spring.data.redis.username=${REDIS_USERNAME}
#spring.data.redis.password=${REDIS_PASSWORD}
#spring.data.redis.timeout=${REDIS_TIMEOUT}

# Call Session Configuration
voice.call-session.key-prefix=${CALL_SESSION_KEY_PREFIX}
voice.call-session.ttl=${CALL_SESSION_TTL}

# STT Runtime Configuration
voice.stt.provider=${STT_PROVIDER}
voice.stt.endpoint=${STT_ENDPOINT}
voice.stt.api-key=${STT_API_KEY}
voice.stt.model=${STT_MODEL}
voice.stt.mode=${STT_MODE}
voice.stt.sample-rate=${STT_SAMPLE_RATE}
voice.stt.timeout=${STT_TIMEOUT}
voice.stt.max-audio-size-bytes=${STT_MAX_AUDIO_SIZE_BYTES}
voice.stt.supported-languages=${STT_SUPPORTED_LANGUAGES}

# =========================================================
# STT REALTIME STREAMING
# =========================================================

voice.stt.streaming-endpoint=${STT_STREAMING_ENDPOINT}
voice.stt.streaming-model=${STT_STREAMING_MODEL:saaras:v3-realtime}
voice.stt.streaming-mode=${STT_STREAMING_MODE:transcribe}
voice.stt.streaming-endpointing=${STT_STREAMING_ENDPOINTING:vad}
voice.stt.streaming-stream-type=${STT_STREAMING_STREAM_TYPE:balanced}
voice.stt.streaming-encoding=${STT_STREAMING_ENCODING:linear16}
voice.stt.streaming-threshold=${STT_STREAMING_THRESHOLD:0.3}
voice.stt.streaming-silence-duration-ms=${STT_STREAMING_SILENCE_DURATION_MS:500}
voice.stt.streaming-min-speech-duration-ms=${STT_STREAMING_MIN_SPEECH_DURATION_MS:250}
voice.stt.streaming-prefix-padding-ms=${STT_STREAMING_PREFIX_PADDING_MS:300}
voice.stt.streaming-return-timestamps=${STT_STREAMING_RETURN_TIMESTAMPS:false}

llm.runtime.provider=${LLM_PROVIDER}
llm.runtime.endpoint=${LLM_ENDPOINT}
llm.runtime.api-key=${LLM_API_KEY}
llm.runtime.api-key-header=${LLM_API_KEY_HEADER}
llm.runtime.model=${LLM_MODEL}
llm.runtime.temperature=${LLM_TEMPERATURE}
llm.runtime.top-p=${LLM_TOP_P}
llm.runtime.max-tokens=${LLM_MAX_TOKENS}
llm.runtime.stream=${LLM_STREAM}
llm.runtime.reasoning-effort=${LLM_REASONING_EFFORT}
llm.runtime.timeout=${LLM_TIMEOUT}
llm.runtime.connection-timeout=${LLM_CONNECTION_TIMEOUT}
llm.runtime.response-timeout=${LLM_RESPONSE_TIMEOUT}
llm.runtime.supported-languages=${LLM_SUPPORTED_LANGUAGES}

tts.runtime.provider=${TTS_PROVIDER}
tts.runtime.endpoint=${TTS_ENDPOINT}
tts.runtime.api-key=${TTS_API_KEY}
tts.runtime.api-key-header=${TTS_API_KEY_HEADER}

tts.runtime.model=${TTS_MODEL}

tts.runtime.default-speaker=${TTS_DEFAULT_SPEAKER}
tts.runtime.default-language=${TTS_DEFAULT_LANGUAGE}
tts.runtime.default-pace=${TTS_DEFAULT_PACE}
tts.runtime.default-speech-sample-rate=${TTS_DEFAULT_SPEECH_SAMPLE_RATE}
tts.runtime.output-audio-codec=${TTS_OUTPUT_AUDIO_CODEC}

tts.runtime.max-text-characters=${TTS_MAX_TEXT_CHARACTERS}
tts.runtime.min-pace=${TTS_MIN_PACE}
tts.runtime.max-pace=${TTS_MAX_PACE}
tts.runtime.max-audio-size-bytes=${TTS_MAX_AUDIO_SIZE_BYTES}

tts.runtime.timeout=${TTS_TIMEOUT}
tts.runtime.connection-timeout=${TTS_CONNECTION_TIMEOUT}
tts.runtime.response-timeout=${TTS_RESPONSE_TIMEOUT}

tts.runtime.supported-languages=${TTS_SUPPORTED_LANGUAGES}

tts.runtime.supported-speakers.male=${TTS_SUPPORTED_SPEAKERS_MALE}
tts.runtime.supported-speakers.female=${TTS_SUPPORTED_SPEAKERS_FEMALE}

tts.runtime.audio-storage-path=${TTS_AUDIO_STORAGE_PATH}
tts.runtime.audio-base-url=${TTS_AUDIO_BASE_URL}

voice.call-session.conversation-storage-path=${CONVERSATION_STORAGE_PATH}

# ==========================
# CALL RECORDING STORAGE
# ==========================
CALL_RECORDING_STORAGE_PATH=uploads/call-recordings

