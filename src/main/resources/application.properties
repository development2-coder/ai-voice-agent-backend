# =========================================================
# TELEPHONY MEDIA
# =========================================================

telephony.media.stream-url=${TELEPHONY_MEDIA_STREAM_URL}
## ==========================
## EXOTEL
## ==========================


exotel.base-url=${EXOTEL_BASE_URL}
exotel.account-sid=${EXOTEL_ACCOUNT_SID}
exotel.api-key=${EXOTEL_API_KEY}
exotel.api-token=${EXOTEL_API_TOKEN}
exotel.caller-id=${EXOTEL_CALLER_ID}
exotel.app-id=${EXOTEL_APP_ID}
exotel.app-url=${EXOTEL_APP_URL}
exotel.status-callback-url=${EXOTEL_STATUS_CALLBACK_URL}

# Real-time bidirectional voice streaming
exotel.stream-url=${EXOTEL_STREAM_URL}
exotel.stream-type=${EXOTEL_STREAM_TYPE:bidirectional}
exotel.record=${EXOTEL_RECORD:true}
exotel.recording-channels=${EXOTEL_RECORDING_CHANNELS:single}
exotel.time-limit=${EXOTEL_TIME_LIMIT:1800}
exotel.provider-code=${EXOTEL_PROVIDER_CODE}
# Secret used by Exotel WSS connection
exotel.stream-secret=${EXOTEL_STREAM_SECRET}

exotel.available-phone-numbers-path=/v2_beta/Accounts/{accountSid}/AvailablePhoneNumbers/{countryCode}/{numberType}
exotel.incoming-phone-numbers-path=/v2_beta/Accounts/{accountSid}/IncomingPhoneNumbers.json


# API Runtime Configuration
flow.api.connect-timeout=${FLOW_API_CONNECT_TIMEOUT}
flow.api.read-timeout=${FLOW_API_READ_TIMEOUT}
flow.api.max-response-size=${FLOW_API_MAX_RESPONSE_SIZE}