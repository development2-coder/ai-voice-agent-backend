# ==========================
# SERVER
# ==========================
server.port=${SERVER_PORT}

# ==========================
# DATABASE
# ==========================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}

jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}


# =========================================================
# PASSWORD RESET
# =========================================================

auth.password-reset.token-expiration=${AUTH_PASSWORD_RESET_TOKEN_EXPIRATION}

auth.password-reset.frontend-url=${AUTH_PASSWORD_RESET_FRONTEND_URL}


# ==========================
# JPA
# ==========================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ==========================
# FLYWAY
# ==========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration


# =========================================================
# SPRINGDOC / SWAGGER
# =========================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/swagger-ui

springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.operationsSorter=method

springdoc.swagger-ui.tagsSorter=alpha

springdoc.default-produces-media-type=application/json

springdoc.default-consumes-media-type=application/json


# =========================================================
# REDIS CONFIGURATION
# =========================================================

#spring.data.redis.host=${REDIS_HOST}
#spring.data.redis.port=${REDIS_PORT}
#spring.data.redis.username=${REDIS_USERNAME}
#spring.data.redis.password=${REDIS_PASSWORD}
#spring.data.redis.timeout=${REDIS_TIMEOUT}


# =========================================================
# CALL SESSION CONFIGURATION
# =========================================================

voice.call-session.key-prefix=${CALL_SESSION_KEY_PREFIX}

voice.call-session.ttl=${CALL_SESSION_TTL}


# =========================================================
# STT RUNTIME CONFIGURATION
# =========================================================

voice.stt.provider=${STT_PROVIDER:sarvam}

voice.stt.endpoint=${STT_ENDPOINT:https://api.sarvam.ai/speech-to-text}

voice.stt.api-key=${STT_API_KEY}

voice.stt.model=${STT_MODEL:saaras:v4}

voice.stt.mode=${STT_MODE:transcribe}

voice.stt.sample-rate=${STT_SAMPLE_RATE:8000}

voice.stt.timeout=${STT_TIMEOUT:30s}

voice.stt.max-audio-size-bytes=${STT_MAX_AUDIO_SIZE_BYTES:52428800}

voice.stt.supported-languages=${STT_SUPPORTED_LANGUAGES:en-IN,hi-IN,mr-IN,ta-IN,te-IN,bn-IN}


# =========================================================
# STT REALTIME STREAMING
# =========================================================

voice.stt.streaming-endpoint=${STT_STREAMING_ENDPOINT:wss://api.sarvam.ai/speech-to-text-realtime/ws}

voice.stt.streaming-model=${STT_STREAMING_MODEL:saaras:v3-realtime}

voice.stt.streaming-mode=${STT_STREAMING_MODE:transcribe}

voice.stt.streaming-endpointing=${STT_STREAMING_ENDPOINTING:vad}

voice.stt.streaming-stream-type=${STT_STREAMING_STREAM_TYPE:balanced}

voice.stt.streaming-encoding=${STT_STREAMING_ENCODING:linear16}

voice.stt.streaming-threshold=${STT_STREAMING_THRESHOLD:0.3}

voice.stt.streaming-silence-duration-ms=${STT_STREAMING_SILENCE_DURATION_MS:500}

voice.stt.streaming-min-speech-duration-ms=${STT_STREAMING_MIN_SPEECH_DURATION_MS:250}

voice.stt.streaming-language=${STT_STREAMING_LANGUAGE:auto}

# =========================================================
# LLM RUNTIME CONFIGURATION
# =========================================================

llm.runtime.provider=${LLM_PROVIDER:sarvam}

llm.runtime.endpoint=${LLM_ENDPOINT:https://api.sarvam.ai/v1/chat/completions}

llm.runtime.api-key=${LLM_API_KEY}

llm.runtime.api-key-header=${LLM_API_KEY_HEADER:api-subscription-key}

llm.runtime.model=${LLM_MODEL:sarvam-105b-conversations}

llm.runtime.temperature=${LLM_TEMPERATURE:0.2}

llm.runtime.top-p=${LLM_TOP_P:1.0}

llm.runtime.max-tokens=${LLM_MAX_TOKENS:2000}

llm.runtime.stream=${LLM_STREAM:false}

llm.runtime.reasoning-effort=${LLM_REASONING_EFFORT}

llm.runtime.timeout=${LLM_TIMEOUT}

llm.runtime.connection-timeout=${LLM_CONNECTION_TIMEOUT}

llm.runtime.response-timeout=${LLM_RESPONSE_TIMEOUT}

llm.runtime.supported-languages=${LLM_SUPPORTED_LANGUAGES:en-IN,hi-IN,mr-IN,ta-IN,te-IN,kn-IN,ml-IN,gu-IN,bn-IN,pa-IN}


# =========================================================
# TTS RUNTIME CONFIGURATION
# =========================================================

tts.runtime.provider=${TTS_PROVIDER:sarvam}

tts.runtime.endpoint=${TTS_ENDPOINT:https://api.sarvam.ai}

tts.runtime.stream-path=${TTS_STREAM_PATH:/text-to-speech/stream}

tts.runtime.api-key=${TTS_API_KEY}

tts.runtime.api-key-header=${TTS_API_KEY_HEADER:api-subscription-key}

tts.runtime.model=${TTS_MODEL:bulbul:v3}

tts.runtime.default-speaker=${TTS_DEFAULT_SPEAKER:shubh}

tts.runtime.default-language=${TTS_DEFAULT_LANGUAGE:en-IN}

tts.runtime.default-pace=${TTS_DEFAULT_PACE:1.0}

# Exotel requires 8 kHz audio for the current bidirectional media flow
tts.runtime.default-speech-sample-rate=${TTS_DEFAULT_SPEECH_SAMPLE_RATE:8000}

# Exotel requires raw PCM/slin-compatible audio rather than WAV/MP3 containers
tts.runtime.output-audio-codec=${TTS_OUTPUT_AUDIO_CODEC:linear16}

tts.runtime.max-text-characters=${TTS_MAX_TEXT_CHARACTERS:2500}

tts.runtime.min-pace=${TTS_MIN_PACE:0.5}

tts.runtime.max-pace=${TTS_MAX_PACE:2.0}

tts.runtime.max-audio-size-bytes=${TTS_MAX_AUDIO_SIZE_BYTES:10485760}

tts.runtime.timeout=${TTS_TIMEOUT}

tts.runtime.connection-timeout=${TTS_CONNECTION_TIMEOUT}

tts.runtime.response-timeout=${TTS_RESPONSE_TIMEOUT}

tts.runtime.supported-languages=${TTS_SUPPORTED_LANGUAGES:en-IN,hi-IN,mr-IN,ta-IN,te-IN,kn-IN,ml-IN,gu-IN,bn-IN,pa-IN}

tts.runtime.supported-speakers.male=${TTS_SUPPORTED_SPEAKERS_MALE}

tts.runtime.supported-speakers.female=${TTS_SUPPORTED_SPEAKERS_FEMALE}

tts.runtime.audio-storage-path=${TTS_AUDIO_STORAGE_PATH}

tts.runtime.audio-base-url=${TTS_AUDIO_BASE_URL}


# =========================================================
# CONVERSATION STORAGE
# =========================================================

voice.call-session.conversation-storage-path=${CONVERSATION_STORAGE_PATH}


# =========================================================
# CALL RECORDING STORAGE
# =========================================================

CALL_RECORDING_STORAGE_PATH=uploads/call-recordings


# =========================================================
# SARVAM
# =========================================================

# Sarvam configuration is handled separately by STT, LLM and TTS
# runtime configuration above.


# =========================================================
# TELEPHONY MEDIA
# =========================================================

telephony.media.stream-url=${TELEPHONY_MEDIA_STREAM_URL}


# =========================================================
# EXOTEL
# =========================================================

exotel.base-url=${EXOTEL_BASE_URL}

exotel.account-sid=${EXOTEL_ACCOUNT_SID}

exotel.api-key=${EXOTEL_API_KEY}

exotel.api-token=${EXOTEL_API_TOKEN}

exotel.caller-id=${EXOTEL_CALLER_ID}

exotel.app-id=${EXOTEL_APP_ID}

exotel.app-url=${EXOTEL_APP_URL}

exotel.status-callback-url=${EXOTEL_STATUS_CALLBACK_URL}


# =========================================================
# REAL-TIME BIDIRECTIONAL VOICE STREAMING
# =========================================================

exotel.stream-url=${EXOTEL_STREAM_URL}

exotel.stream-type=${EXOTEL_STREAM_TYPE:bidirectional}

exotel.record=${EXOTEL_RECORD:true}

exotel.recording-channels=${EXOTEL_RECORDING_CHANNELS:single}

exotel.time-limit=${EXOTEL_TIME_LIMIT:1800}

exotel.provider-code=${EXOTEL_PROVIDER_CODE}

# Secret used by Exotel WSS connection
exotel.stream-secret=${EXOTEL_STREAM_SECRET}


# =========================================================
# EXOTEL PHONE NUMBER APIs
# =========================================================

exotel.available-phone-numbers-path=/v2_beta/Accounts/{accountSid}/AvailablePhoneNumbers/{countryCode}/{numberType}

exotel.incoming-phone-numbers-path=/v2_beta/Accounts/{accountSid}/IncomingPhoneNumbers

exotel.active-call-legs-path=/v1/Accounts/{accountSid}/Calls/{callSid}/ActiveLegs.json

exotel.call-leg-path=/v1/Accounts/{accountSid}/Calls/{callSid}/Legs/{legSid}.json


# =========================================================
# FLOW API RUNTIME CONFIGURATION
# =========================================================

flow.api.connect-timeout=${FLOW_API_CONNECT_TIMEOUT}

flow.api.read-timeout=${FLOW_API_READ_TIMEOUT}

flow.api.max-response-size=${FLOW_API_MAX_RESPONSE_SIZE}

# =========================================================
# AGENT CONFIGURATION OPTIONS
# =========================================================

agent.configuration.options.greetings=${AGENT_GREETING_OPTIONS:Hello! How can I help you today?,Hi! How may I assist you?,Welcome! How can I assist you today?}